<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sesli Sohbet</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--mute:#6e6e73;--line:#e0e0e5;--acc:#4f46e5;--on:#16a34a;--bad:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c20;--text:#f2f2f4;--mute:#9a9aa3;--line:#2e2e35;--acc:#818cf8;--on:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:24px 16px}
main.wide{max-width:980px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
main.wide .layout{grid-template-columns:minmax(0,440px) minmax(0,1fr)}
@media (max-width:760px){main.wide .layout{grid-template-columns:minmax(0,1fr)}}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 20px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.82rem;color:var(--mute);margin:10px 0 4px}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
button:disabled{opacity:.6;cursor:default}
.pri{background:var(--acc);color:#fff;width:100%;margin-top:16px}
.row{display:flex;gap:8px}
.row button{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line)}
.row .bad{color:var(--bad)}
#status{color:var(--mute);font-size:.88rem;min-height:1.2em;margin-top:10px}
.user{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.user:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;border:3px solid transparent;transition:border-color .1s}
.user.talk .av{border-color:var(--on)}
.mid{flex:1;min-width:0}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow{display:flex;align-items:center;gap:8px;margin-top:4px}
.vrow input{flex:1;width:auto;min-width:0;padding:0;border:0;background:transparent;height:18px;cursor:pointer}
.pc{font-size:.72rem;color:var(--mute);width:2.8em;text-align:right;flex:none}
.st{font-size:.78rem;color:var(--mute)}
.code{font-family:ui-monospace,monospace;background:var(--bg);padding:2px 8px;border-radius:6px}
#board .bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 10px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
.pad{width:100%;max-width:84px;aspect-ratio:1/1;padding:0;border-radius:50%;background:transparent center/contain no-repeat;transition:transform .08s,filter .15s}

    <label for="name">Adın</label>
    <input id="name" maxlength="20" placeholder="Örn. Ahmet" autocomplete="off">
    <label for="code">Oda adı (tahmin edilmesi zor bir şey yaz)</label>
    <input id="code" maxlength="30" value="" placeholder="Örn. ustalar-4821" autocomplete="off">
    <button class="pri" id="go">Katıl</button>
    <div id="status"></div>
  </section>

  <section id="room" hidden>
    <div class="card">
      <div class="st" style="margin-bottom:6px">Oda: <span class="code" id="rc"></span></div>
      <div id="list"></div>
    </div>
    <div class="row">
      <button id="mute">🎤 Sesi kapat</button>
      <button id="leave" class="bad">Ayrıl</button>
    </div>
  </section>
  </div>

  <section id="board" class="card" hidden>
    <div class="bh"><b>🔊 Ses efektleri</b><span class="st">odadaki herkes duyar</span></div>
    <div id="slots" class="slots"></div>
    <label class="vol">Efekt sesi <input type="range" id="vol" min="0" max="100" value="80"></label>
    <div id="bmsg" class="st"></div>
    <input type="file" id="file" accept=".mp3,.wav,audio/mpeg,audio/wav,audio/x-wav" hidden>
  </section>
  </div>
  <div id="audios"></div>
</main>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var ICE = {iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
  var myId = "", myName = "", code = "", es = null, stream = null;
  var peers = {}, muted = false, ac = null, raf = null, local = {talk:false, an:null};

  function status(t){ $("status").textContent = t; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }
  function norm(s){
    var m = {"ı":"i","ş":"s","ç":"c","ğ":"g","ö":"o","ü":"u"};
    return s.toLowerCase().replace(/[ışçğöü]/g,function(c){return m[c]}).replace(/[^a-z0-9_.-]/g,"");
  }
  function send(to, data){
    fetch("/signal?room="+encodeURIComponent(code)+"&id="+myId,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({to:to, data:data})
    }).catch(function(){});
  }

  var rows = {}, volByName = {};
  // Kişi sesi: 0-%200, orta (%100) normal. %100'e kadar normal çalar, üstünde Web Audio ile güçlendirilir.
  function applyVol(p){
    var v = p.vol / 100;
    if(v <= 1 || !ac || !p.stream){
      if(p.audio){ p.audio.muted = false; p.audio.volume = Math.min(1, v); }
      if(p.gain) p.gain.gain.value = 0;
    } else {
      try{
        if(!p.gain){
          p.gain = ac.createGain();
          ac.createMediaStreamSource(p.stream).connect(p.gain);
          p.gain.connect(ac.destination);
        }
        if(p.audio) p.audio.muted = true;
        p.gain.gain.value = v;
        ac.resume();
      }catch(e){ if(p.audio){ p.audio.muted = false; p.audio.volume = 1; } }
    }
  }
  function makeRow(key, isMe){
    var el = document.createElement("div"); el.className = "user";
    el.innerHTML = '<div class="av"></div><div class="mid"><div class="nm"></div>' +
      (isMe ? '' : '<div class="vrow"><input type="range" min="0" max="200" step="5" value="100" title="Bu kişinin sesi. Orta = normal, çift tıkla sıfırla" aria-label="Kişinin ses düzeyi"><span class="pc">100%</span></div>') +
      '</div><div class="st"></div>';
    var r = {el: el, av: el.querySelector(".av"), nm: el.querySelector(".nm"), st: el.querySelector(".st"), name: null, vname: null};
    if(!isMe){
      r.sl = el.querySelector("input"); r.pc = el.querySelector(".pc");
      var setV = function(v){
        var p = peers[key]; if(!p) return;
        p.vol = v; volByName[p.name || "Misafir"] = v; r.pc.textContent = v + "%"; applyVol(p);
      };
      r.sl.oninput = function(){ setV(+this.value); };
      r.sl.ondblclick = function(){ this.value = 100; setV(100); };
    }
    return r;
  }
  function render(){
    var list = $("list"), keys = ["_me"].concat(Object.keys(peers));
    Object.keys(rows).forEach(function(k){ if(keys.indexOf(k) < 0){ rows[k].el.remove(); delete rows[k]; } });
    keys.forEach(function(k){
      var isMe = k === "_me", p = isMe ? null : peers[k];
      var r = rows[k] || (rows[k] = makeRow(k, isMe));
      if(!r.el.parentNode) list.appendChild(r.el);
      var name = isMe ? myName + " (sen)" : (p.name || "Misafir");
      if(r.name !== name){ r.name = name; r.nm.textContent = name; r.av.textContent = (name.trim().charAt(0) || "?").toUpperCase(); }
      if(!isMe && r.vname !== name){ // isim belli olunca bu kişi için daha önce ayarlanan ses düzeyini geri yükle
        r.vname = name;
        var v = volByName[name] != null ? volByName[name] : 100;
        p.vol = v; r.sl.value = v; r.pc.textContent = v + "%"; applyVol(p);
      }
      var st = isMe ? (muted ? "sessiz" : "bağlı") : (p.state === "connected" ? "bağlı" : (p.state === "failed" ? "bağlanamadı" : "bağlanıyor…"));
      if(r.st.textContent !== st) r.st.textContent = st;
      r.el.classList.toggle("talk", !!(isMe ? (local.talk && !muted) : p.talk));
    });
  }

  function meter(ms, obj){
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      var an = ac.createAnalyser(); an.fftSize = 512;
      ac.createMediaStreamSource(ms).connect(an);
      obj.an = an;
    }catch(e){}
  }
  function loop(){
    var changed = false, buf = new Uint8Array(256);
    function lvl(o){
      if(!o.an) return false;
      o.an.getByteTimeDomainData(buf);
      var m = 0; for(var i=0;i<buf.length;i++){ m = Math.max(m, Math.abs(buf[i]-128)); }
      return m > 12;
    }
    var l = lvl(local); if(l !== local.talk){ local.talk = l; changed = true; }
    Object.keys(peers).forEach(function(id){ var t = lvl(peers[id]); if(t !== peers[id].talk){ peers[id].talk = t; changed = true; } });
    if(changed) render();
    raf = requestAnimationFrame(loop);
  }

  function makePeer(id, name){
    if(peers[id]){ if(name) peers[id].name = name; return peers[id]; }
    var p = peers[id] = {name:name, pending:[], state:"new", talk:false, an:null, vol:100, stream:null, gain:null};
    var pc = p.pc = new RTCPeerConnection(ICE);
    stream.getTracks().forEach(function(t){ pc.addTrack(t, stream); });
    pc.onicecandidate = function(e){ if(e.candidate) send(id, {t:"ice", c:e.candidate.toJSON()}); };
    pc.ontrack = function(e){
      var a = p.audio || (p.audio = document.createElement("audio"));
      a.autoplay = true; a.playsInline = true; a.srcObject = e.streams[0];
      p.stream = e.streams[0];
      $("audios").appendChild(a); a.play().catch(function(){});
      meter(e.streams[0], p);
      applyVol(p);
    };
    pc.onconnectionstatechange = function(){
      p.state = pc.connectionState;
      if(p.state === "closed"){ drop(id); } else { render(); }
    };
    render();
    return p;
  }
  function drop(id){
    var p = peers[id]; if(!p) return;
    try{ p.pc.close(); }catch(e){}
    if(p.audio) p.audio.remove();
    delete peers[id]; render();
  }
  function flush(p){
    var q = p.pending; p.pending = [];
    q.forEach(function(c){ p.pc.addIceCandidate(c).catch(function(){}); });
  }
  async function callPeer(id){
    var p = peers[id];
    var o = await p.pc.createOffer();
    await p.pc.setLocalDescription(o);
    send(id, {t:"offer", sdp:p.pc.localDescription.sdp});
  }

  async function onSignal(from, d){
    try{
      if(d.t === "offer"){
        var p = makePeer(from);
        await p.pc.setRemoteDescription({type:"offer", sdp:d.sdp});
        flush(p);
        var a = await p.pc.createAnswer();
        await p.pc.setLocalDescription(a);
        send(from, {t:"answer", sdp:p.pc.localDescription.sdp});
      } else if(d.t === "answer"){
        var r = peers[from]; if(!r) return;
        await r.pc.setRemoteDescription({type:"answer", sdp:d.sdp});
        flush(r);
      } else if(d.t === "ice"){
        var s = peers[from]; if(!s || !d.c) return;
        if(s.pc.remoteDescription) s.pc.addIceCandidate(d.c).catch(function(){});
        else s.pending.push(d.c);
      }
    }catch(e){ console.error(e); }
  }

  function connect(){
    es = new EventSource("/events?room="+encodeURIComponent(code)+"&id="+myId+"&name="+encodeURIComponent(myName));
    es.addEventListener("init", function(e){
      var d = JSON.parse(e.data);
      Object.keys(peers).forEach(drop); // yeniden bağlanma durumunda temiz başla
      d.peers.forEach(function(p){ makePeer(p.id, p.name); callPeer(p.id); });
      cueVer = d.cues || {}; preloadCues();
      setBoard(d.board);
      status("");
    });
    es.addEventListener("board", function(e){ var d = JSON.parse(e.data); setBoard(d.board); });
    es.addEventListener("play", function(e){ var d = JSON.parse(e.data); playLocal(d.slot, d.v, d.sname, d.name, d.cue); });
    es.addEventListener("join", function(e){ var d = JSON.parse(e.data); makePeer(d.id, d.name); });
    es.addEventListener("leave", function(e){ drop(JSON.parse(e.data).id); });
    es.addEventListener("signal", function(e){ var d = JSON.parse(e.data); onSignal(d.from, d.data); });
    es.addEventListener("full", function(){ status("Oda dolu (en fazla 6 kişi)."); leave(); });
  }

  async function start(){
    myName = ($("name").value.trim() || "Misafir").slice(0,20);
    code = norm($("code").value.trim());
    if(!code){ status("Bir oda adı yaz."); return; }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      status("Bu bağlantıda mikrofon kullanılamıyor. Adres https:// ile başlamalı."); return;
    }
    $("go").disabled = true; status("Mikrofon izni isteniyor…");
    try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); }catch(e){} // tıklama anında aç (iPhone/Safari için)
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
    }catch(e){
      status("Mikrofona erişilemedi [" + (e && e.name || "hata") + "]. Tarayıcı izinlerini kontrol et.");
      $("go").disabled = false; return;
    }
    try{ var cfg = await (await fetch("/config")).json(); if(cfg.iceServers) ICE = {iceServers:cfg.iceServers}; }catch(e){}
    myId = Math.random().toString(36).slice(2,10);
    $("join").hidden = true; $("room").hidden = false; $("rc").textContent = code;
    document.querySelector("main").classList.add("wide"); $("board").hidden = false;
    meter(stream, local); loop(); render(); connect();
  }

  function leave(){
    if(es){ try{ navigator.sendBeacon("/bye?room="+encodeURIComponent(code)+"&id="+myId); }catch(e){} es.close(); es = null; }
    Object.keys(peers).forEach(drop);
    if(stream) stream.getTracks().forEach(function(t){t.stop()});
    if(raf) cancelAnimationFrame(raf);
    stream = null; local = {talk:false, an:null}; muted = false;
    $("mute").textContent = "🎤 Sesi kapat";
    $("room").hidden = true; $("join").hidden = false; $("go").disabled = false;
    document.querySelector("main").classList.remove("wide"); $("board").hidden = true;
    stopSounds(); setBoard([]); bmsg("");
  }

  // ---------- Ses tahtası ----------
  var SLOTS = 8, MAXB = 2 * 1024 * 1024, board = [], cueVer = {}, bufs = {}, active = [], mg = null, vol = 0.8;
  function bmsg(t){ $("bmsg").textContent = t; }
  function bq(slot){ return "room="+encodeURIComponent(code)+"&id="+myId+"&slot="+slot; }
  function fileUrl(slot, v){ return "/sound/file?room="+encodeURIComponent(code)+"&slot="+slot+"&v="+v; }
  function master(){
    if(!mg){ mg = ac.createGain(); mg.gain.value = vol; mg.connect(ac.destination); }
    return mg;
  }
  function loadBuf(k, url){
    if(!bufs[k]){
      bufs[k] = fetch(url).then(function(r){ if(!r.ok) throw new Error("indirilemedi"); return r.arrayBuffer(); })
        .then(function(ab){ return new Promise(function(ok, bad){ ac.decodeAudioData(ab, ok, bad); }); });
      bufs[k].catch(function(){ delete bufs[k]; });
    }
    return bufs[k];
  }
  function getBuf(slot, v){ return loadBuf(code+":"+slot+":"+v, fileUrl(slot, v)); }
  function cueBuf(kind){
    var v = cueVer[kind];
    if(!v) return Promise.reject(new Error("ses yok"));
    return loadBuf("cue:"+kind+":"+v, "/sound/cue?kind="+kind+"&v="+v);
  }
  function preloadCues(){ if(ac) ["join","leave"].forEach(function(k){ cueBuf(k).catch(function(){}); }); }
  function setBoard(b){
    board = Array.isArray(b) ? b : [];
    var h = "";
    for(var i = 0; i < SLOTS; i++){
      var s = board[i];
      if(s){
        h += '<div class="slot" id="slot'+i+'"><button class="x" data-del="'+i+'" title="Sesi sil" aria-label="Sesi sil">×</button>'
          + '<button class="pad red" data-play="'+i+'" title="'+esc(s.name)+'" aria-label="'+esc(s.name)+'"></button>'
          + '<div class="sn" title="'+esc(s.name)+'">'+esc(s.name)+'</div></div>';
        if(ac) getBuf(i, s.v).catch(function(){}); // önceden indir ve hazırla, basınca gecikme olmasın
      } else {
        h += '<div class="slot"><button class="pad empty" data-add="'+i+'" title="Ses ekle" aria-label="Ses ekle">+</button><div class="sn st">Boş</div></div>';
      }
    }
    $("slots").innerHTML = h;
  }
  function flash(slot){
    var el = $("slot"+slot); if(!el) return;
    el.classList.add("hit"); setTimeout(function(){ el.classList.remove("hit"); }, 180);
  }
  function why(err){ return (err && (err.name || err.message)) || "hata"; }
  function withRetry(fn){ return fn().catch(function(){ return new Promise(function(r){ setTimeout(r, 400); }).then(fn); }); }
  // fn: ses tamponunu döndüren fonksiyon, done: ses bitince (ya da hata olursa) çağrılır
  function playBuffer(fn, done){
    withRetry(fn).then(function(buf){
      var src = ac.createBufferSource(); src.buffer = buf; src.connect(master()); src.start();
      active.push(src);
      src.onended = function(){ var i = active.indexOf(src); if(i >= 0) active.splice(i, 1); if(done) done(); };
      if(done) setTimeout(done, Math.ceil(buf.duration * 1000) + 1500);
    }).catch(function(err){ bmsg("Ses çalınamadı (" + why(err) + ")"); if(done) done(); });
  }
  // Giriş/çıkış sesleri sırayla çalar, üst üste binmez
  var cueQ = [], cuePlaying = false, CUE_MAX_AGE = 8000;
  function enqueueCue(kind, who){
    var now = Date.now();
    cueQ = cueQ.filter(function(c){ return now - c.t < CUE_MAX_AGE; });
    if(cueQ.length >= 4) return;
    cueQ.push({kind: kind, who: who, t: now});
    if(!cuePlaying) nextCue();
  }
  function nextCue(){
    var c = cueQ.shift();
    while(c && Date.now() - c.t > CUE_MAX_AGE) c = cueQ.shift();
    if(!c){ cuePlaying = false; return; }
    cuePlaying = true;
    bmsg(c.who + (c.kind === "join" ? " odaya girdi 🔔" : " odadan çıktı 🚪"));
    var done = false;
    function fin(){ if(done) return; done = true; nextCue(); }
    setTimeout(fin, 15000); // takılırsa sıra ilerlesin
    try{ ac.resume(); }catch(e){}
    playBuffer(function(){ return cueBuf(c.kind); }, fin);
  }
  function playLocal(slot, v, sname, who, cue){
    if(!ac) return;
    if(cue){ enqueueCue(cue, who); return; }
    flash(slot); bmsg(who + " → " + sname);
    try{ ac.resume(); }catch(e){}
    playBuffer(function(){ return getBuf(slot, v); });
  }
  function stopSounds(){
    active.forEach(function(s){ try{ s.stop(); }catch(e){} });
    active = []; bufs = {}; cueQ = []; cuePlaying = false;
  }
  var pendingSlot = -1;
  $("slots").onclick = function(e){
    var t = e.target.closest("[data-play],[data-del],[data-add]"); if(!t) return;
    if(t.dataset.play !== undefined){
      fetch("/sound/play?"+bq(+t.dataset.play), {method:"POST"}).catch(function(){ bmsg("Sunucuya ulaşılamadı."); });
    } else if(t.dataset.del !== undefined){
      var i = +t.dataset.del;
      if(board[i] && confirm('"' + board[i].name + '" odadaki herkes için silinsin mi?')){
        fetch("/sound/delete?"+bq(i), {method:"POST"}).catch(function(){ bmsg("Silinemedi."); });
      }
    } else {
      pendingSlot = +t.dataset.add; $("file").value = ""; $("file").click();
    }
  };
  $("file").onchange = async function(){
    var f = this.files[0]; if(!f || pendingSlot < 0) return;
    var slot = pendingSlot; pendingSlot = -1;
    if(!/\.(mp3|wav)$/i.test(f.name)){ bmsg("Sadece mp3 veya wav yükleyebilirsin."); return; }
    if(f.size > MAXB){ bmsg("Dosya çok büyük (en fazla 2 MB)."); return; }
    var name = f.name.replace(/\.[^.]+$/, "").slice(0, 24);
    bmsg("Yükleniyor…");
    try{
      var r = await fetch("/sound/upload?"+bq(slot)+"&name="+encodeURIComponent(name), {
        method:"POST", headers:{"Content-Type": /\.wav$/i.test(f.name) ? "audio/wav" : "audio/mpeg"}, body:f
      });
      if(r.status === 204) bmsg("Eklendi: " + name);
      else if(r.status === 409) bmsg("Bu yer az önce doldu, başka bir boş yer seç.");
      else if(r.status === 413) bmsg("Dosya çok büyük (en fazla 2 MB).");
      else if(r.status === 415) bmsg("Bu dosya geçerli bir mp3 ya da wav gibi görünmüyor.");
      else if(r.status === 507) bmsg("Sunucudaki ses alanı doldu, bazı sesleri sil.");
      else bmsg("Yüklenemedi (" + r.status + ").");
    }catch(err){ bmsg("Yüklenemedi, bağlantını kontrol et."); }
  };
  $("vol").oninput = function(){ vol = this.value / 100; if(mg) mg.gain.value = vol; };

  $("go").onclick = start;
  $("leave").onclick = function(){ leave(); status(""); };
  $("mute").onclick = function(){
    muted = !muted;
    if(stream) stream.getAudioTracks().forEach(function(t){ t.enabled = !muted; });
    $("mute").textContent = muted ? "🔇 Sesi aç" : "🎤 Sesi kapat";
    render();
  };
  window.addEventListener("pagehide", function(){ if(es){ try{ navigator.sendBeacon("/bye?room="+encodeURIComponent(code)+"&id="+myId); }catch(e){} es.close(); } });
})();
</script>
</body>
</html>
